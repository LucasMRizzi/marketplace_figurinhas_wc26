<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <title>Marketplace de Figurinhas</title>

    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Marketplace</h1>

        <p>Login</p>

        <form method="post" action="/login">

            <div class="campo">

                <label>Email</label>

                <input
                        type="email"
                        name="username"
                        placeholder="Digite seu email"
                        required
                >

            </div>

            <div class="campo">

                <label>Senha</label>

                <input
                        type="password"
                        name="password"
                        placeholder="Digite sua senha"
                        required
                >

            </div>

            <button type="submit">

                Entrar

            </button>

        </form>

    </div>

</div>

</body>
</html>
